<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherwood Vault - Admin Sanctum</title>
    
    <!-- Ultra-fast ESM module import for Viem -->
    <script type="module">
        import { createWalletClient, createPublicClient, custom, http, parseEther } from "https://esm.sh";
        window.viemModules = { createWalletClient, createPublicClient, custom, http, parseEther };
    </script>
    
    <style>
        body { background-color: #0b0f0c; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at center, #1c1313 0%, #0b0f0c 100%); }
        .admin-dashboard { background: #1a1111; color: #e2e8f0; font-family: Georgia, serif; padding: 28px; border-radius: 20px; border: 1px solid #4a1c1c; max-width: 450px; width: 100%; box-shadow: 0 15px 35px rgba(25, 0, 0, 0.6); }
        .admin-title { font-size: 16px; color: #ff6b6b; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; text-align: center; letter-spacing: 1px; }
        .sect-title { font-size: 11px; color: #b57c7c; text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px 0; font-family: -apple-system, sans-serif; border-bottom: 1px dashed #4a1c1c; padding-bottom: 4px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .input-field { background: #120d0d; border: 1px solid #3d1d1d; color: #ffffff; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; }
        .admin-btn { background: linear-gradient(135deg, #3d1a1a 0%, #261111 100%); border: 1px solid #ff6b6b; color: #ff6b6b; font-family: Georgia, serif; font-size: 13px; font-weight: bold; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer !important; transition: all 0.3s ease; }
        .admin-btn:hover { background: #ff6b6b; color: #0b0f0c; box-shadow: 0 0 15px rgba(255, 107, 107, 0.3); }
        .wallet-top-btn { background: none; border: 1px dashed #4a1c1c; color: #a88787; width: 100%; padding: 10px; font-family: Georgia, serif; font-size: 13px; border-radius: 8px; margin-bottom: 16px; cursor: pointer !important; }
        .wallet-top-btn.connected { border-style: solid; border-color: #ff6b6b; color: #ff6b6b; }
        .ledger-box { margin-top: 16px; background: #0a0707; border: 1px solid #241414; border-radius: 8px; padding: 10px; min-height: 36px; }
        .ledger-content { font-family: monospace; font-size: 11px; color: #c49595; word-wrap: break-word; }
        #sanctum-content { display: none; }
    </style>
</head>
<body>
    <div class="admin-dashboard">
        <button class="wallet-top-btn" id="wallet-btn" onclick="connectAdminWallet()">Awaken Guardian Connection</button>
        <div class="admin-title">Vault Guardian Sanctum</div>
        <div id="sanctum-content">
            <div class="sect-title">1. Bulk Inventory Management</div>
            <div class="input-group">
                <input type="text" class="input-field" id="batch-deposit-input" placeholder="e.g. 2001, 2002">
                <button class="admin-btn" onclick="executeAdminBatchDeposit()">Execute Batch Inventory Seed</button>
            </div>
            <div class="sect-title">2. Pure Liquidity Pool Injector</div>
            <div class="input-group">
                <input type="number" class="input-field" id="liquidity-input" placeholder="Amount of $DERP">
                <button class="admin-btn" onclick="executeAdminLiquidityInjection()">Inject Pool Liquidity</button>
            </div>
            <div class="sect-title">3. Fee Constraints Configuration</div>
            <div class="input-group">
                <input type="number" class="input-field" id="fee-input" placeholder="400 = 4%">
                <button class="admin-btn" onclick="executeAdminFeeAdjustment()">Modify System Fees</button>
            </div>
            <div class="sect-title">4. Emergency Extraction Procedures</div>
            <div style="display: flex; gap: 8px; margin-top: 4px;">
                <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;"><input type="number" class="input-field" id="withdraw-token-input" placeholder="Tokens"><button class="admin-btn" style="font-size:11px;" onclick="executeEmergencyTokenClawback()">Clawback $DERP</button></div>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;"><input type="number" class="input-field" id="withdraw-nft-input" placeholder="NFT ID"><button class="admin-btn" style="font-size:11px;" onclick="executeEmergencyNftClawback()">Clawback NFT</button></div>
            </div>
        </div>
        <div class="ledger-box"><div class="ledger-content" id="ledger-content">🔒 Checking system scripts...</div></div>
    </div>
    <script>
        const VAULT_ADDRESS = "0x28C096D2546f07f8170727b1D9618862fCfd8022";
        const NFT_CONTRACT = "0x321135606e0B035E30b4B566f6Fb9bCF75E82902"; 
        const TARGET_TOKEN = "0x6543B7746ca744C4bb2198191e71f40FF04c41b9";
        const robinhoodChain = { id: 4663, name: 'Robinhood Chain', rpcUrls: { default: { http: ['https://robinhood.com'] } } };

        const getEthProvider = () => window.ethereum || (window.parent && window.parent.ethereum);
        const vAbi = [
            { name: "owner", type: "function", stateMutability: "view", inputs: [], outputs: [{ type: "address" }] },
            { name: "adminBatchDeposit", type: "function", stateMutability: "nonpayable", inputs: [{ type: "uint256[]" }], outputs: [] },
            { name: "setWrapFee", type: "function", stateMutability: "nonpayable", inputs: [{ type: "uint256" }], outputs: [] },
            { name: "emergencyWithdrawTokens", type: "function", stateMutability: "nonpayable", inputs: [{ type: "uint256" }], outputs: [] },
            { name: "emergencyWithdrawNFT", type: "function", stateMutability: "nonpayable", inputs: [{ type: "uint256" }], outputs: [] }
        ];

        function pushLog(m) { document.getElementById('ledger-content').innerText = m; }
        
        function verifyViemInitialization() {
            if (window.viemModules) pushLog("🔒 Sanctum locked. Connect admin wallet.");
            else setTimeout(verifyViemInitialization, 100);
        }
        window.addEventListener('DOMContentLoaded', verifyViemInitialization);

        async function connectAdminWallet() {
            if (!window.viemModules) return pushLog("⏳ Fetching modules... Click again in 2 seconds.");
            const eth = getEthProvider();
            if (!eth) return pushLog("⚠️ Web3 wallet undetected.");
            
            try {
                pushLog("🔮 Contacting wallet extension...");
                const { createWalletClient, createPublicClient, custom, http } = window.viemModules;
                const accounts = await eth.request({ method: 'eth_requestAccounts' });
                const activeUser = accounts[0];
                
                await eth.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: "0x1237" }] });
                
                const client = createWalletClient({ account: activeUser, chain: robinhoodChain, transport: custom(eth) });
                const publicClient = createPublicClient({ chain: robinhoodChain, transport: http() });
                
                pushLog("🛡️ Performing ownership security handshake...");
                const contractOwner = await publicClient.readContract({ address: VAULT_ADDRESS, abi: vAbi, functionName: 'owner' });

                if (contractOwner.toLowerCase() !== activeUser.toLowerCase()) {
                    pushLog("⛔ Security Rejection: Wallet is not owner.");
                    return;
                }

                document.getElementById('wallet-btn').innerText = `Guardian: ${activeUser.substring(0,6)}...`;
                document.getElementById('wallet-btn').classList.add('connected');
                document.getElementById('sanctum-content').style.display = "block";
                pushLog("🔓 Access cleared. Welcome back to the Sherwood Sanctum.");
            } catch (err) { pushLog(`❌ Connection Error: ${err.message || err}`); }
        }
        async function executeAdminBatchDeposit() {
            const rawInput = document.getElementById('batch-deposit-input').value;
            if(!rawInput) return alert("Please specify token IDs.");
            const idArray = rawInput.split(',').map(item => BigInt(item.trim())).filter(item => !isNaN(Number(item)));
            
            const eth = getEthProvider();
            const { createWalletClient, createPublicClient, custom, http } = window.viemModules;
            const accounts = await eth.request({ method: 'eth_accounts' });
            const activeUser = accounts[0];
            
            const client = createWalletClient({ account: activeUser, chain: robinhoodChain, transport: custom(eth) });
            const publicClient = createPublicClient({ chain: robinhoodChain, transport: http() });
            
            try {
                pushLog("🛡️ Checking core bulk NFT operator allowance path...");
                const nftAbi = [{ name: "setApprovalForAll", type: "function", stateMutability: "nonpayable", inputs: [{ type: "address" }, { type: "bool" }], outputs: [] }, { name: "isApprovedForAll", type: "function", stateMutability: "view", inputs: [{ type: "address" }, { type: "address" }], outputs: [{ type: "bool" }] }];
                
                const isApproved = await publicClient.readContract({ address: NFT_CONTRACT, abi: nftAbi, functionName: 'isApprovedForAll', args: [activeUser, VAULT_ADDRESS] });
                if(!isApproved) {
                    pushLog("⏳ Authorizing bulk operator permissions...");
                    const { request } = await publicClient.simulateContract({ account: activeUser, address: NFT_CONTRACT, abi: nftAbi, functionName: 'setApprovalForAll', args: [VAULT_ADDRESS, true] });
                    const hash = await client.writeContract(request);
                    await publicClient.waitForTransactionReceipt({ hash });
                }
                
                pushLog(`📦 Transmitting seed write array (${idArray.length} items)...`);
                const { request } = await publicClient.simulateContract({ account: activeUser, address: VAULT_ADDRESS, abi: vAbi, functionName: 'adminBatchDeposit', args: [idArray] });
                const hash = await client.writeContract(request);
                await publicClient.waitForTransactionReceipt({ hash });
                pushLog("✨ Seeding processed successfully onto L2 nodes.");
            } catch(e) { pushLog(`❌ Batch deposit failed.`); }
        }

        async function executeAdminLiquidityInjection() {
            const val = document.getElementById('liquidity-input').value;
            if(!val) return alert("Specify an amount.");
            const eth = getEthProvider();
            const { createWalletClient, createPublicClient, custom, http, parseEther } = window.viemModules;
            const accounts = await eth.request({ method: 'eth_accounts' });
            const activeUser = accounts[0];
            
            const client = createWalletClient({ account: activeUser, chain: robinhoodChain, transport: custom(eth) });
            const publicClient = createPublicClient({ chain: robinhoodChain, transport: http() });
            const erc20Abi = [{ name: "transfer", type: "function", stateMutability: "nonpayable", inputs: [{ type: "address" }, { type: "uint256" }], outputs: [{ type: "bool" }] }];
            
            try {
                pushLog("💸 Discharging token transfer payload...");
                const { request } = await publicClient.simulateContract({ account: activeUser, address: TARGET_TOKEN, abi: erc20Abi, functionName: 'transfer', args: [VAULT_ADDRESS, parseEther(val)] });
                const hash = await client.writeContract(request);
                await publicClient.waitForTransactionReceipt({ hash });
                pushLog("✨ Liquidity injected successfully.");
            } catch(e) { pushLog("❌ Injection transfer failed."); }
        }

        async function executeAdminFeeAdjustment() {
            const bps = document.getElementById('fee-input').value;
            if(!bps) return alert("Enter BPS value.");
            const eth = getEthProvider();
            const { createWalletClient, createPublicClient, custom, http } = window.viemModules;
            const accounts = await eth.request({ method: 'eth_accounts' });
            const activeUser = accounts[0];
            const client = createWalletClient({ account: activeUser, chain: robinhoodChain, transport: custom(eth) });
            const publicClient = createPublicClient({ chain: robinhoodChain, transport: http() });
            
            try {
                pushLog("⚙️ Sending fee modification configuration...");
                const { request } = await publicClient.simulateContract({ account: activeUser, address: VAULT_ADDRESS, abi: vAbi, functionName: 'setWrapFee', args: [BigInt(bps)] });
                const hash = await client.writeContract(request);
                await publicClient.waitForTransactionReceipt({ hash });
                pushLog("✨ Fees configuration updated on-chain.");
            } catch(e) { pushLog("❌ Update failed."); }
        }

        async function executeEmergencyTokenClawback() {
            const val = document.getElementById('withdraw-token-input').value;
            if(!val) return alert("Enter token quantity.");
            const eth = getEthProvider();
            const { createWalletClient, createPublicClient, custom, http, parseEther } = window.viemModules;
            const accounts = await eth.request({ method: 'eth_accounts' });
            const activeUser = accounts[0];
            const client = createWalletClient({ account: activeUser, chain: robinhoodChain, transport: custom(eth) });
            const publicClient = createPublicClient({ chain: robinhoodChain, transport: http() });
            
            try {
                pushLog("🚨 Broadcasting token emergency clawback...");
                const { request } = await publicClient.simulateContract({ account: activeUser, address: VAULT_ADDRESS, abi: vAbi, functionName: 'emergencyWithdrawTokens', args: [parseEther(val)] });
                const hash = await client.writeContract(request);
                await publicClient.waitForTransactionReceipt({ hash });
                pushLog("✨ Tokens clawed back successfully.");
            } catch(e) { pushLog("❌ Token clawback failed."); }
        }

        async function executeEmergencyNftClawback() {
            const id = document.getElementById('withdraw-nft-input').value;
            if(!id) return alert("Enter Token ID.");
            const eth = getEthProvider();
            const { createWalletClient, createPublicClient, custom, http } = window.viemModules;
            const accounts = await eth.request({ method: 'eth_accounts' });
            const activeUser = accounts[0];
            const client = createWalletClient({ account: activeUser, chain: robinhoodChain, transport: custom(eth) });
            const publicClient = createPublicClient({ chain: robinhoodChain, transport: http() });
            
            try {
                pushLog(`🚨 Broadcasting NFT release for ID #${id}...`);
                const { request } = await publicClient.simulateContract({ account: activeUser, address: VAULT_ADDRESS, abi: vAbi, functionName: 'emergencyWithdrawNFT', args: [BigInt(id)] });
                const hash = await client.writeContract(request);
                await publicClient.waitForTransactionReceipt({ hash });
                pushLog(`✨ NFT ID #${id} returned safely.`);
            } catch(e) { pushLog("❌ NFT clawback failed."); }
        }
    </script>
</body>
</html>
