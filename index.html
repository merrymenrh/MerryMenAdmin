<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherwood Vault - Admin Sanctum</title>
    
    <!-- Primary and Secondary Web3 Network Fallback Nodes -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        body { background-color: #0b0f0c; color: #e2e8f0; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .admin-dashboard { background: #1a1111; padding: 24px; border-radius: 12px; border: 1px solid #4a1c1c; max-width: 420px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .admin-title { font-size: 16px; color: #ff6b6b; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; text-align: center; }
        .sect-title { font-size: 11px; color: #b57c7c; text-transform: uppercase; margin: 12px 0 6px 0; border-bottom: 1px dashed #4a1c1c; padding-bottom: 2px; }
        .input-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .input-field { background: #120d0d; border: 1px solid #3d1d1d; color: #ffffff; padding: 8px; border-radius: 6px; font-family: monospace; }
        .admin-btn { background: #3d1a1a; border: 1px solid #ff6b6b; color: #ff6b6b; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .wallet-top-btn { background: none; border: 1px dashed #4a1c1c; color: #a88787; width: 100%; padding: 10px; border-radius: 8px; margin-bottom: 12px; cursor: pointer; }
        .wallet-top-btn.connected { border-style: solid; border-color: #ff6b6b; color: #ff6b6b; }
        .ledger-box { margin-top: 12px; background: #0a0707; border: 1px solid #241414; border-radius: 6px; padding: 8px; min-height: 24px; font-family: monospace; font-size: 11px; color: #c49595; }
        #sanctum-content { display: none; }
    </style>
</head>
<body>
    <div class="admin-dashboard">
        <button class="wallet-top-btn" id="wallet-btn" onclick="connectAdminWallet()">Awaken Guardian Connection</button>
        <div class="admin-title">Vault Guardian Sanctum</div>
        <div id="sanctum-content">
            <div class="sect-title">1. Bulk Inventory Management</div>
            <div class="input-group">
                <input type="text" class="input-field" id="batch-deposit-input" placeholder="e.g. 2001, 2002">
                <button class="admin-btn" onclick="executeAdminBatchDeposit()">Execute Batch Inventory Seed</button>
            </div>
            <div class="sect-title">2. Pure Liquidity Pool Injector</div>
            <div class="input-group">
                <input type="number" class="input-field" id="liquidity-input" placeholder="Amount of $DERP">
                <button class="admin-btn" onclick="executeAdminLiquidityInjection()">Inject Pool Liquidity</button>
            </div>
            <div class="sect-title">3. Fee Constraints Configuration</div>
            <div class="input-group">
                <input type="number" class="input-field" id="fee-input" placeholder="400 = 4%">
                <button class="admin-btn" onclick="executeAdminFeeAdjustment()">Modify System Fees</button>
            </div>
            <div class="sect-title">4. Emergency Extraction Procedures</div>
            <div style="display: flex; gap: 8px; margin-top: 4px;">
                <div style="flex: 1;"><input type="number" class="input-field" id="w-tok" placeholder="Tokens" style="width:85%;"><button class="admin-btn" style="padding:6px;font-size:11px;margin-top:4px;" onclick="executeEmergencyTokenClawback()">Clawback $DERP</button></div>
                <div style="flex: 1;"><input type="number" class="input-field" id="w-nft" placeholder="NFT ID" style="width:85%;"><button class="admin-btn" style="padding:6px;font-size:11px;margin-top:4px;" onclick="executeEmergencyNftClawback()">Clawback NFT</button></div>
            </div>
        </div>
        <div class="ledger-box" id="ledger-content">🔒 Synchronizing forest components...</div>
    </div>
    <script>
        const VAULT_ADDRESS = "0x28C096D2546f07f8170727b1D9618862fCfd8022";
        const NFT_CONTRACT = "0x321135606e0B035E30b4B566f6Fb9bCF75E82902"; 
        const TARGET_TOKEN = "0x6543B7746ca744C4bb2198191e71f40FF04c41b9";
        const ROBINHOOD_CHAIN_ID = "0x1237"; 
        let userWalletSigner = null;

        const vaultAbi = ["function owner() public view returns (address)","function adminBatchDeposit(uint256[] calldata tokenIds) external","function setWrapFee(uint256 _newFeeBps) external","function emergencyWithdrawTokens(uint256 amount) external","function emergencyWithdrawNFT(uint256 tokenId) external"];
        const erc20Abi = ["function transfer(address to, uint256 amount) external returns (bool)","function approve(address spender, uint256 value) external returns (bool)"];

        const pushLog = (m) => { document.getElementById('ledger-content').innerText = m; };

        // FIX: Active waiting loop checks for window.ethers object properties every 100ms
        function verifyEthersInitialization() {
            if (typeof window.ethers !== 'undefined' || typeof ethers !== 'undefined') {
                pushLog("🔒 Sanctum locked. Connect admin wallet.");
            } else {
                setTimeout(verifyEthersInitialization, 100);
            }
        }
        window.addEventListener('DOMContentLoaded', verifyEthersInitialization);

        async function connectAdminWallet() {
            const activeEthers = window.ethers || ethers;
            if (typeof activeEthers === 'undefined') {
                pushLog("⏳ Network library delay. Wait 2 seconds and click again.");
                return;
            }
            if (!window.ethereum) return pushLog("⚠️ Web3 wallet undetected.");
            
            try {
                pushLog("🔮 Contacting wallet extension...");
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const activeUser = accounts[0]; 
                
                await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: ROBINHOOD_CHAIN_ID }] });
                
                const browserProvider = new activeEthers.BrowserProvider(window.ethereum);
                userWalletSigner = await browserProvider.getSigner();
                
                const tempContract = new activeEthers.Contract(VAULT_ADDRESS, vaultAbi, browserProvider);
                const contractOwner = await tempContract.owner();

                if (contractOwner.toLowerCase() !== activeUser.toLowerCase()) {
                    pushLog("⛔ Security Rejection: Wallet is not owner.");
                    return;
                }

                document.getElementById('wallet-btn').innerText = `Guardian: ${activeUser.substring(0,6)}...`;
                document.getElementById('wallet-btn').classList.add('connected');
                document.getElementById('sanctum-content').style.display = "block";
                pushLog("🔓 Access cleared. Welcome back to the Sherwood Sanctum.");
            } catch (err) { pushLog(`❌ Connection Error: ${err.message || err}`); }
        }

        async function executeAdminBatchDeposit() {
            const activeEthers = window.ethers || ethers;
            const rawInput = document.getElementById('batch-deposit-input').value;
            if(!rawInput) return alert("Please specify token IDs.");
            const idArray = rawInput.split(',').map(item => parseInt(item.trim())).filter(item => !isNaN(item));
            const vault = new activeEthers.Contract(VAULT_ADDRESS, vaultAbi, userWalletSigner);
            const nft = new activeEthers.Contract(NFT_CONTRACT, ["function setApprovalForAll(address op, bool app) external","function isApprovedForAll(address o, address op) external view returns (bool)"], userWalletSigner);
            try {
                pushLog("🛡️ Checking core bulk NFT permissions...");
                const isApproved = await nft.isApprovedForAll(await userWalletSigner.getAddress(), VAULT_ADDRESS);
                if(!isApproved) { pushLog("⏳ Signing bulk operator allowance..."); let approveTx = await nft.setApprovalForAll(VAULT_ADDRESS, true); await approveTx.wait(); }
                pushLog(`📦 Sending batch write block (${idArray.length} items)...`);
                let tx = await vault.adminBatchDeposit(idArray); await tx.wait();
                pushLog("✨ Seeding processed successfully.");
            } catch(e) { pushLog(`❌ Batch deposit failed.`); }
        }

        async function executeAdminLiquidityInjection() {
            const activeEthers = window.ethers || ethers;
            const val = document.getElementById('liquidity-input').value;
            if(!val) return alert("Specify an amount.");
            const token = new activeEthers.Contract(TARGET_TOKEN, erc20Abi, userWalletSigner);
            try { pushLog("💸 Discharging direct ERC-20 transfer payload..."); let tx = await token.transfer(VAULT_ADDRESS, activeEthers.parseEther(val)); await tx.wait(); pushLog("✨ Liquidity injected."); } catch(e) { pushLog("❌ Injection transfer failed."); }
        }

        async function executeAdminFeeAdjustment() {
            const activeEthers = window.ethers || ethers;
            const bps = document.getElementById('fee-input').value;
            if(!bps) return alert("Enter BPS value.");
            const vault = new activeEthers.Contract(VAULT_ADDRESS, vaultAbi, userWalletSigner);
            try { pushLog("⚙️ Sending fee modification configuration..."); let tx = await vault.setWrapFee(parseInt(bps)); await tx.wait(); pushLog("✨ Contract fees updated."); } catch(e) { pushLog("❌ Update failed."); }
        }

        async function executeEmergencyTokenClawback() {
            const activeEthers = window.ethers || ethers;
            const val = document.getElementById('w-tok').value;
            if(!val) return alert("Enter token quantity.");
            const vault = new activeEthers.Contract(VAULT_ADDRESS, vaultAbi, userWalletSigner);
            try { pushLog("🚨 Broadcasting token emergency clawback..."); let tx = await vault.emergencyWithdrawTokens(activeEthers.parseEther(val)); await tx.wait(); pushLog("✨ Tokens returned successfully."); } catch(e) { pushLog("❌ Token clawback failed."); }
        }

        async function executeEmergencyNftClawback() {
            const activeEthers = window.ethers || ethers;
            const id = document.getElementById('w-nft').value;
            if(!id) return alert("Enter Token ID.");
            const vault = new activeEthers.Contract(VAULT_ADDRESS, vaultAbi, userWalletSigner);
            try { pushLog(`🚨 Broadcasting NFT release for ID #${id}...`); let tx = await vault.emergencyWithdrawNFT(parseInt(id)); await tx.wait(); pushLog(`✨ NFT ID #${id} returned safely.`); } catch(e) { pushLog("❌ NFT clawback failed."); }
        }
    </script>
</body>
</html>
